<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alicorn 2019 B10 クイズ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Inter:wght@400;600;700&display=swap');

:root {
  --bg: #0f1117;
  --surface: #1a1d2e;
  --surface2: #252840;
  --accent: #6c63ff;
  --accent2: #48cfad;
  --correct: #1a4a30;
  --correct-border: #2ecc71;
  --wrong: #4a1a1a;
  --wrong-border: #e74c3c;
  --text: #e8eaf6;
  --text2: #9ca3b8;
  --choice-hover: #2e3350;
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
}

.container {
  width: 100%;
  max-width: 680px;
}

header {
  text-align: center;
  padding: 20px 0 12px;
}

header h1 {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.04em;
}

header p {
  font-size: 0.82rem;
  color: var(--text2);
  margin-top: 4px;
}

.progress-bar-wrap {
  background: var(--surface);
  border-radius: 8px;
  height: 8px;
  margin: 12px 0;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 8px;
  transition: width 0.4s ease;
}

.progress-label {
  text-align: right;
  font-size: 0.78rem;
  color: var(--text2);
  margin-bottom: 16px;
}

.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px 20px 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.pos-tag {
  display: inline-block;
  background: var(--surface2);
  color: var(--accent);
  font-size: 0.7rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  margin-bottom: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.word-display {
  font-size: 1.8rem;
  font-weight: 700;
  text-align: center;
  padding: 14px 0;
  color: #fff;
  letter-spacing: 0.02em;
}

.prompt {
  font-size: 0.85rem;
  color: var(--text2);
  text-align: center;
  margin-bottom: 18px;
}

.choices {
  display: grid;
  gap: 10px;
}

.choice-btn {
  background: var(--surface2);
  border: 2px solid transparent;
  border-radius: var(--radius);
  color: var(--text);
  font-size: 1rem;
  font-family: 'Noto Sans JP', sans-serif;
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.1s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.choice-btn:hover:not(:disabled) {
  background: var(--choice-hover);
  border-color: var(--accent);
  transform: translateY(-1px);
}

.choice-btn .letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bg);
  font-size: 0.78rem;
  font-weight: 700;
  flex-shrink: 0;
  color: var(--accent);
}

.choice-btn.correct {
  background: var(--correct);
  border-color: var(--correct-border);
}

.choice-btn.wrong {
  background: var(--wrong);
  border-color: var(--wrong-border);
  opacity: 0.75;
}

.choice-btn.correct .letter {
  background: var(--correct-border);
  color: #fff;
}

.choice-btn.wrong .letter {
  background: var(--wrong-border);
  color: #fff;
}

.explanation {
  margin-top: 14px;
  border-radius: var(--radius);
  overflow: hidden;
}

.exp-panel {
  padding: 14px 16px;
  font-size: 0.88rem;
  line-height: 1.7;
  font-family: 'Noto Sans JP', sans-serif;
}

.exp-panel.correct-panel {
  background: rgba(46, 204, 113, 0.12);
  border-left: 4px solid var(--correct-border);
}

.exp-panel.wrong-panel {
  background: rgba(231, 76, 60, 0.1);
  border-left: 4px solid var(--wrong-border);
  margin-top: 8px;
}

.exp-heading {
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.exp-panel.correct-panel .exp-heading { color: var(--correct-border); }
.exp-panel.wrong-panel .exp-heading { color: var(--wrong-border); }

.next-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-size: 1rem;
  font-weight: 700;
  padding: 14px;
  cursor: pointer;
  margin-top: 16px;
  letter-spacing: 0.04em;
  transition: opacity 0.2s, transform 0.1s;
}

.next-btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

/* Score screen */
.score-screen {
  text-align: center;
  padding: 40px 20px;
}

.score-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 0 30px rgba(108,99,255,0.4);
}

.score-number {
  font-size: 2rem;
  font-weight: 700;
  color: #fff;
}

.score-total {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.8);
}

.score-msg {
  font-size: 1.1rem;
  color: var(--text);
  margin-bottom: 10px;
  font-weight: 600;
}

.score-sub {
  font-size: 0.88rem;
  color: var(--text2);
  margin-bottom: 28px;
}

.retry-btn {
  background: var(--surface2);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  color: var(--accent);
  font-size: 0.95rem;
  font-weight: 700;
  padding: 12px 32px;
  cursor: pointer;
  transition: background 0.2s;
}

.retry-btn:hover {
  background: var(--accent);
  color: #fff;
}

.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Alicorn 2019 — B10 副詞節（1）</h1>
    <p>英→日 4択クイズ | 全23問</p>
  </header>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 23</div>

  <div id="quizArea">
    <div class="card">
      <span class="pos-tag" id="posTag">n</span>
      <div class="word-display" id="wordDisplay">—</div>
      <div class="prompt">日本語の意味を選んでください</div>
      <div class="choices" id="choicesArea"></div>
      <div class="explanation hidden" id="explanationArea"></div>
    </div>
    <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">次の問題 →</button>
  </div>

  <div class="score-screen hidden" id="scoreScreen">
    <div class="score-circle">
      <div class="score-number" id="scoreNum">0</div>
      <div class="score-total" id="scoreTotal">/ 0</div>
    </div>
    <div class="score-msg" id="scoreMsg">—</div>
    <div class="score-sub" id="scoreSub"></div>
    <button class="retry-btn" onclick="startQuiz()">やり直す</button>
  </div>
</div>

<script>

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions() {
  return QUIZ_DATA.map(item => {
    const choices = shuffle([
      { text: item.answer, correct: true, reason: null },
      ...item.distractors.map(d => ({ text: d.text, correct: false, reason: d.reason }))
    ]);
    return { ...item, choices };
  });
}

function startQuiz() {
  questions = buildQuestions();
  current = 0;
  score = 0;
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('scoreScreen').classList.add('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;
  
  document.getElementById('progressBar').style.width = (current / total * 100) + '%';
  document.getElementById('progressLabel').textContent = current + ' / ' + total;
  document.getElementById('posTag').textContent = q.pos;
  document.getElementById('wordDisplay').textContent = q.word;
  
  const letters = ['A', 'B', 'C', 'D'];
  const area = document.getElementById('choicesArea');
  area.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${c.text}</span>`;
    btn.onclick = () => selectAnswer(i);
    area.appendChild(btn);
  });
  
  document.getElementById('explanationArea').classList.add('hidden');
  document.getElementById('explanationArea').innerHTML = '';
  document.getElementById('nextBtn').classList.add('hidden');
  answered = false;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  
  const q = questions[current];
  const chosen = q.choices[idx];
  const btns = document.querySelectorAll('.choice-btn');
  
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (q.choices[i].correct) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
  });
  
  const expArea = document.getElementById('explanationArea');
  expArea.classList.remove('hidden');
  
  if (chosen.correct) {
    score++;
    expArea.innerHTML = `
      <div class="exp-panel correct-panel">
        <div class="exp-heading">✓ 正解！ — ポイント</div>
        <div>${q.explanation}</div>
      </div>`;
  } else {
    expArea.innerHTML = `
      <div class="exp-panel correct-panel">
        <div class="exp-heading">✓ 正解の理由</div>
        <div>${q.explanation}</div>
      </div>
      <div class="exp-panel wrong-panel">
        <div class="exp-heading">✗ あなたが選んだ選択肢について</div>
        <div>「${chosen.text}」を選んだ理由と正解との違い：${chosen.reason}</div>
      </div>`;
  }
  
  document.getElementById('nextBtn').classList.remove('hidden');
  if (current === questions.length - 1) {
    document.getElementById('nextBtn').textContent = '結果を見る →';
  }
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showScore();
  } else {
    renderQuestion();
  }
}

function showScore() {
  const total = questions.length;
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('scoreScreen').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('progressLabel').textContent = total + ' / ' + total;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreTotal').textContent = '/ ' + total;
  
  const pct = score / total;
  let msg, sub;
  if (pct >= 0.9) { msg = '🎉 素晴らしい！'; sub = 'ほぼ完璧です。次のセクションへ進みましょう！'; }
  else if (pct >= 0.7) { msg = '👍 よくできました！'; sub = '苦手な語を復習してさらにアップを目指そう。'; }
  else if (pct >= 0.5) { msg = '💪 もう少し！'; sub = '語彙リストに戻って確認しましょう。'; }
  else { msg = '📖 要復習'; sub = '語彙リストをしっかり読み直してから再挑戦！'; }
  
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('scoreSub').textContent = sub;
}

startQuiz();
</script>
